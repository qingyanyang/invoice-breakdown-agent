name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: invoice_breakdown_test
          POSTGRES_USER: fixture_user
          POSTGRES_PASSWORD: fixture_password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U fixture_user -d invoice_breakdown_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run backend tests against disposable PostgreSQL
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://fixture_user:fixture_password@127.0.0.1:5432/invoice_breakdown_test
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Smoke-test Docker startup
        run: |
          docker build -t invoice-breakdown-agent:ci backend
          container=$(docker run --detach --publish 127.0.0.1:18000:8000 invoice-breakdown-agent:ci)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          curl --fail --silent --show-error --retry-connrefused --retry 15 --retry-delay 1 \
            --max-time 5 http://127.0.0.1:18000/health
          status=$(curl --silent --show-error --max-time 5 \
            --output "$RUNNER_TEMP/readiness.json" --write-out '%{http_code}' http://127.0.0.1:18000/ready)
          test "$status" = 503
          python -c 'import json, sys; assert json.load(open(sys.argv[1])) == {"status": "not_ready"}' \
            "$RUNNER_TEMP/readiness.json"
