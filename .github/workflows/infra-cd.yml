name: Infrastructure CD

on:
  workflow_dispatch:
    inputs:
      run_bootstrap:
        description: "Create resource group if needed"
        type: boolean
        default: false

      confirm_destructive:
        description: "Type DEPLOY to confirm infrastructure deployment"
        type: string
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-cd-demo
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-knowledge-intelligence-demo
  LOCATION: australiasoutheast
  PARAMETER_FILE: infra/parameters/demo.bicepparam

jobs:
  deploy:
    name: Deploy infrastructure (demo)
    runs-on: ubuntu-latest
    environment: demo

    steps:
      - name: Confirm deployment intent
        env:
          CONFIRMATION: ${{ inputs.confirm_destructive }}
        run: |
          set -euo pipefail

          if [ "$CONFIRMATION" != "DEPLOY" ]; then
            echo "ERROR: Type DEPLOY to confirm."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bootstrap resource group
        if: inputs.run_bootstrap
        run: |
          set -euo pipefail

          az deployment sub create \
            --location "$LOCATION" \
            --template-file infra/bootstrap/main.bicep \
            --parameters \
              resourceGroupName="$RESOURCE_GROUP" \
              location="$LOCATION"

      - name: Validate deployment secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -euo pipefail

          bash infra/scripts/validate-deploy-secrets.sh "$PARAMETER_FILE"

      - name: Validate Bicep deployment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPERATOR_TOKENS: ${{ secrets.OPERATOR_TOKENS }}
        run: |
          set -euo pipefail

          EXTRA_PARAMS=()
          if [[ -n "${LLM_API_KEY:-}" ]]; then
            EXTRA_PARAMS+=(--parameters "llmApiKey=${LLM_API_KEY}")
            EXTRA_PARAMS+=(--parameters "enableLlmApiKey=true")
          fi

          az deployment group validate \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters "$PARAMETER_FILE" \
            --parameters "databaseUrl=${DATABASE_URL}" \
            ${EXTRA_PARAMS[@]+"${EXTRA_PARAMS[@]}"}

      - name: Deploy resource group infrastructure
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPERATOR_TOKENS: ${{ secrets.OPERATOR_TOKENS }}
        run: |
          set -euo pipefail

          DEPLOYMENT_NAME="eki-demo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "DEPLOYMENT_NAME=$DEPLOYMENT_NAME" >> "$GITHUB_ENV"

          EXTRA_PARAMS=()
          if [[ -n "${LLM_API_KEY:-}" ]]; then
            EXTRA_PARAMS+=(--parameters "llmApiKey=${LLM_API_KEY}")
            EXTRA_PARAMS+=(--parameters "enableLlmApiKey=true")
          fi

          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$DEPLOYMENT_NAME" \
            --template-file infra/main.bicep \
            --parameters "$PARAMETER_FILE" \
            --parameters "databaseUrl=${DATABASE_URL}" \
            ${EXTRA_PARAMS[@]+"${EXTRA_PARAMS[@]}"}

      - name: Print non-sensitive outputs
        run: |
          set -euo pipefail

          az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$DEPLOYMENT_NAME" \
            --query properties.outputs \
            -o json
