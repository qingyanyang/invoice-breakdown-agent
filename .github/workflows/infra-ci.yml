name: Infrastructure CI

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bicep-validate:
    name: Bicep build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure CLI (for Bicep)
        uses: azure/cli@v2
        with:
          inlineScript: |
            az bicep install
            az bicep version

      - name: Build bootstrap template
        uses: azure/cli@v2
        with:
          inlineScript: |
            az bicep build --file infra/bootstrap/main.bicep

      - name: Build main template
        uses: azure/cli@v2
        with:
          inlineScript: |
            az bicep build --file infra/main.bicep

      - name: Lint bootstrap template
        uses: azure/cli@v2
        with:
          inlineScript: |
            az bicep lint --file infra/bootstrap/main.bicep

      - name: Lint main template
        uses: azure/cli@v2
        with:
          inlineScript: |
            az bicep lint --file infra/main.bicep

  what-if:
    name: Azure what-if (optional)
    runs-on: ubuntu-latest
    needs: bicep-validate
    if: ${{ vars.RUN_INFRA_WHAT_IF == 'true' }}
    environment: demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate deploy secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -euo pipefail
          chmod +x infra/scripts/validate-deploy-secrets.sh
          ./infra/scripts/validate-deploy-secrets.sh infra/parameters/demo.bicepparam

      - name: What-if resource group deployment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            EXTRA_PARAMS=()
            if [[ -n "${LLM_API_KEY:-}" ]]; then
              EXTRA_PARAMS+=(--parameters "llmApiKey=${LLM_API_KEY}")
              EXTRA_PARAMS+=(--parameters "enableLlmApiKey=true")
            fi
            az deployment group what-if \
              --resource-group rg-knowledge-intelligence-demo \
              --template-file infra/main.bicep \
              --parameters infra/parameters/demo.bicepparam \
              --parameters "databaseUrl=${DATABASE_URL:-}" \
              ${EXTRA_PARAMS[@]+"${EXTRA_PARAMS[@]}"}
