name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-cd.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

concurrency:
  group: backend-cd-demo
  cancel-in-progress: true

env:
  RESOURCE_GROUP: rg-knowledge-intelligence-demo
  CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
  # Public GHCR image: ghcr.io/<owner>/<IMAGE_NAME>:<tag>
  IMAGE_NAME: knowledge-intelligence-api

jobs:
  build-and-deploy:
    name: Build, push GHCR, update Container App
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require backend Dockerfile
        id: gate
        run: |
          if [ ! -f backend/Dockerfile ]; then
            echo "backend/Dockerfile not found. Skipping backend CD until the FastAPI app is scaffolded."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate required variables
        if: steps.gate.outputs.skip != 'true'
        run: |
          if [ -z "${{ env.CONTAINER_APP_NAME }}" ]; then
            echo "Set Environment variable CONTAINER_APP_NAME (from infra outputs) before backend CD."
            exit 1
          fi

      - name: Log in to GHCR
        if: steps.gate.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push public image to GHCR
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="ghcr.io/${OWNER}/${{ env.IMAGE_NAME }}:latest"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker build -t "${IMAGE}" -t "${IMAGE_LATEST}" backend
          docker push "${IMAGE}"
          docker push "${IMAGE_LATEST}"
          echo "Ensure the GHCR package visibility is Public so Azure Container Apps can pull without credentials."

      - name: Azure Login (OIDC)
        if: steps.gate.outputs.skip != 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Secrets (database-url, llm-api-key) are IaC-owned via Bicep Option A.
      - name: Update Container App image
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE }}"

      - name: Health check smoke test
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          FQDN="$(az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)"
          echo "Checking https://${FQDN}/health"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://${FQDN}/health"; then
              echo "Health check passed."
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after retries."
          exit 1
