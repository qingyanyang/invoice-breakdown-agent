name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-cd.yml"

  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Azure Container Apps (disable for initial GHCR image build)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  packages: write

concurrency:
  group: backend-cd-demo
  cancel-in-progress: true

env:
  RESOURCE_GROUP: rg-knowledge-intelligence-demo
  CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
  IMAGE_NAME: knowledge-intelligence-api

jobs:
  build-and-deploy:
    name: Build, publish GHCR, deploy Container App
    runs-on: ubuntu-latest
    environment: demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Dockerfile
        run: |
          set -euo pipefail

          if [ ! -f backend/Dockerfile ]; then
            echo "ERROR: backend/Dockerfile not found."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image names
        run: |
          set -euo pipefail

          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"

          IMAGE="ghcr.io/${OWNER}/${IMAGE_NAME}:${GITHUB_SHA}"
          IMAGE_LATEST="ghcr.io/${OWNER}/${IMAGE_NAME}:latest"

          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=${IMAGE_LATEST}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ env.IMAGE_LATEST }}

      - name: Determine deployment mode
        id: deployment
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_INPUT: ${{ inputs.deploy }}
        run: |
          set -euo pipefail

          # Push to main always attempts Azure deploy (needs CONTAINER_APP_NAME).
          # Manual run defaults deploy=false so the first public GHCR image can publish alone.
          if [ "$EVENT_NAME" = "push" ] || [ "$DEPLOY_INPUT" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Image published. Azure deployment skipped."
          fi

      - name: Validate Azure configuration
        if: steps.deployment.outputs.enabled == 'true'
        run: |
          set -euo pipefail

          if [ -z "$CONTAINER_APP_NAME" ]; then
            echo "ERROR: Set CONTAINER_APP_NAME in GitHub Environment 'demo' (from infra outputs)."
            echo "For initial image-only publish, use workflow_dispatch with deploy=false."
            exit 1
          fi

      - name: Azure Login (OIDC)
        if: steps.deployment.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        if: steps.deployment.outputs.enabled == 'true'
        run: |
          set -euo pipefail

          az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --output none

          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE"

      - name: Health check smoke test
        if: steps.deployment.outputs.enabled == 'true'
        run: |
          set -euo pipefail

          FQDN="$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)"

          if [ -z "$FQDN" ]; then
            echo "ERROR: Container App FQDN not found."
            exit 1
          fi

          echo "Checking https://${FQDN}/health"

          for i in $(seq 1 12); do
            if curl --fail --silent --show-error \
              --max-time 10 \
              "https://${FQDN}/health"; then
              echo ""
              echo "Health check passed."
              exit 0
            fi

            echo "Attempt $i failed. Retrying..."
            sleep 10
          done

          echo "ERROR: Health check failed."
          exit 1
