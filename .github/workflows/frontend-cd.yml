name: Frontend CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-cd-demo
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy Static Web App
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require frontend package.json
        id: gate
        run: |
          if [ ! -f frontend/package.json ]; then
            echo "frontend/package.json not found. Skipping frontend CD until the React app is scaffolded."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        if: steps.gate.outputs.skip != 'true'
        working-directory: frontend
        run: npm run lint --if-present

      - name: Typecheck
        if: steps.gate.outputs.skip != 'true'
        working-directory: frontend
        run: npm run typecheck --if-present

      - name: Build
        if: steps.gate.outputs.skip != 'true'
        working-directory: frontend
        env:
          # Public API URL only — not a secret. SWA is in eastasia; token is region-agnostic.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        if: steps.gate.outputs.skip != 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          output_location: ""
          skip_app_build: true
